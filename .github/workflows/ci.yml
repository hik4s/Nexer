name: RelatPy CI

on:
  push:
    branches: ["master", "feat/**"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-python:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            Requisitos.txt
            apps/backend/requirements.txt
            apps/worker/requirements.txt
            apps/runtime/requirements.txt

      - name: Install legacy dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r Requisitos.txt

      - name: Install new backend dependencies
        run: python -m pip install -r apps/backend/requirements.txt

      - name: Install new runtime dependencies
        run: python -m pip install -r apps/runtime/requirements.txt

      - name: Dependency consistency
        run: python -m pip check

      - name: Backend tests
        shell: pwsh
        env:
          PYTHONPATH: apps/backend
        run: python -m unittest discover -s apps/backend/tests -v

      - name: Worker tests
        shell: pwsh
        env:
          PYTHONPATH: apps/backend;apps/worker;apps/runtime
        run: python -m unittest discover -s apps/worker/tests -v

      - name: Runtime tests
        shell: pwsh
        env:
          PYTHONPATH: apps/runtime
        run: python -m unittest discover -s apps/runtime/tests -v

      - name: Syntax check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.py |
            Where-Object {
              $_.FullName -notlike "*\\venv\\*" -and
              $_.FullName -notlike "*\\.venv\\*" -and
              $_.FullName -notlike "*\\build\\*" -and
              $_.FullName -notlike "*\\dist\\*" -and
              $_.FullName -notlike "*\\__pycache__\\*"
            }
          if (-not $files) { throw "No Python files found." }
          foreach ($file in $files) {
            python -m py_compile $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($file.FullName)" }
          }

      - name: Legacy smoke tests
        run: python -m unittest discover -s tests -v

      - name: Dependency security audit
        run: python -m pip install pip-audit && python -m pip_audit -r Requisitos.txt -r apps/backend/requirements.txt -r apps/runtime/requirements.txt

  test-frontend:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm install --no-audit --no-fund

      - name: Frontend tests
        working-directory: apps/frontend
        run: npm test

      - name: Frontend typecheck
        working-directory: apps/frontend
        run: npm run typecheck

      - name: Frontend build
        working-directory: apps/frontend
        run: npm run build

      - name: Frontend dependency audit
        working-directory: apps/frontend
        run: npm audit --audit-level=high
