name: RelatPy CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            Requisitos.txt
            apps/backend/requirements.txt
            apps/worker/requirements.txt
      - name: Install legacy dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r Requisitos.txt
      - name: Install new backend dependencies
        run: python -m pip install -r apps/backend/requirements.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Backend tests
        shell: pwsh
        env:
          PYTHONPATH: apps/backend
        run: python -m unittest discover -s apps/backend/tests -v
      - name: Worker tests
        shell: pwsh
        env:
          PYTHONPATH: apps/backend;apps/worker
        run: python -m unittest discover -s apps/worker/tests -v
      - name: Syntax check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.py |
            Where-Object { $_.FullName -notmatch "\\(venv|\.venv|build|dist|__pycache__)\\" }
          if (-not $files) { throw "No Python files found." }
          foreach ($file in $files) {
            python -m py_compile $file.FullName
          }
      - name: Smoke tests
        run: python -m unittest discover -s tests -v
      - name: Dependency security audit
        run: python -m pip install pip-audit && python -m pip_audit -r Requisitos.txt -r apps/backend/requirements.txt
